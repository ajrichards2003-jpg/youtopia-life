name: Homepage integrity
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/check-homepage.py'
      - '.github/workflows/homepage-integrity.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify homepage references and newsletter
        run: python scripts/check-homepage.py
