name: Indexing integrity
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'netlify.toml'
      - 'scripts/check-indexing.py'
      - '.github/workflows/indexing-integrity.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-indexing.py
