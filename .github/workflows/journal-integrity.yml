name: Journal integrity
on:
  pull_request:
    paths:
      - 'articles/**'
      - 'scripts/check-journal*.py'
      - 'sitemap.xml'
      - 'netlify.toml'
      - 'editorial/**'
      - '.github/workflows/journal-integrity.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify feature lengths, sources and links
        run: |
          python scripts/check-journal.py
          python scripts/check-journal-seo.py
