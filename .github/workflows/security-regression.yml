name: Security regression checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked production dependencies
        run: npm ci --ignore-scripts --omit=dev
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
      - name: Check security config
        run: python scripts/check-security.py
      - name: Build only public files
        run: python scripts/build-public.py
      - name: Verify publish directory
        run: python scripts/check-security.py
